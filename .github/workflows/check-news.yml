name: MSCW News Checker

# 每 5 分钟检查一次 Nexon 冒险岛怀旧服公告, 有新公告(或内容更新)时推送到黑盒语音
# 说明:
#   - 公共仓库: cron 最小间隔就是 5 分钟, 且公共仓库 GitHub Actions 完全免费(不限分钟数)
#   - 调度可能因 GitHub 负载有几分钟延迟, 属正常现象
#   - 若上一次运行还没结束, 本次调度会被跳过(本工作流很短, 一般 1-2 分钟内跑完)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: # 支持手动触发测试

permissions:
  contents: write # 需要写回 state.json（去重状态）

concurrency:
  group: mscw-news-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # v5 基于 Node 24, 消除 "Node.js 20 is deprecated" 警告
        uses: actions/checkout@v5
        with:
          # schedule 事件默认把 run 绑定到"触发那一刻"的 commit: 上一轮刚推送完但还没
          # 回写 state.json 时, 排队中的这一轮会读到旧状态, 把同一公告再推一遍
          # (2026-10-04 #12973/#12974 的 head 都是 c3a5b253 就是这个原因)。
          # 固定 ref: main, 配合上面的 concurrency 串行, 让每轮都用最新状态启动。
          ref: main

      - name: Validate terms.json + self-test
        # 离线冒烟自检(术语表语法/解析/时间行/拆条/多公告选择), 任一失败直接让工作流失败,
        # 防止带损坏术语表或回归代码推送"瞎翻版"
        run: |
          python main.py --self-test
          python bench_translate.py --no-fetch
          echo "冒烟自检 OK"

      - name: Run news checker
        env:
          HEYCHAT_TOKEN: ${{ secrets.HEYCHAT_TOKEN }}
          ROOM_ID: ${{ secrets.ROOM_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # DEEPSEEK_MODEL: "deepseek-v4-flash"   # 可选: 换 DeepSeek 模型时在此设置
          # 可选配置（不设置则用默认值）:
          # DRY_RUN: "0"
          # MAX_MSG_LEN: "1500"
          # PUSH_ON_CONTENT_UPDATE: "1"
          # MAX_NEWS_PER_RUN: "5"      # 单次最多推送条数(防停机恢复刷屏)
          # MAX_NEWS_AGE_HOURS: "48"   # 只补推最近 N 小时内的公告
          # LAG_ALERT_MIN: "30"        # 发布->推送延迟告警阈值(分钟)
        run: python main.py

      - name: Commit state (only when new news pushed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "::notice::state.json 无变化, 本次没有新公告"
          else
            git commit -m "chore: 更新已推送公告状态 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # 先同步远端再推: 否则远端已被别的 run 推进时会 push 被拒(fetch first),
            # 整轮变失败且状态回写丢失(2026-10-04 #12969/#12974 即如此)。
            git fetch origin main
            git rebase origin/main || {
              echo "::warning::state.json 回写冲突, 改用远端最新状态, 下轮会重新判定"
              git rebase --abort
              git reset --hard origin/main
            }
            git push
            echo "::notice::已记录最新公告状态"
          fi
